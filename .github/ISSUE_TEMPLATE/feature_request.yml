name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [Office view (2D), Office view (3D), UI and panels, Server, Claude Code plugin, Documentation, Other]
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: It keeps AI Office local and private (no data leaves the computer).
          required: true
