<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-labelledby="t d">
<title id="t">How AI Office works</title>
<desc id="d">Flow diagram: Claude Code sessions (CLI or desktop) write sessions and transcripts under ~/.claude; the AI Office server on 127.0.0.1:4848 reads them read-only, derives each agent status and streams it live to your browser, which shows the office in 2D or 3D. A plugin hooks channel connects Claude Code and the server in both directions for permissions and messages.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f86f7"/><stop offset="1" stop-color="#2f6fed"/></linearGradient>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><rect x="15" y="15" width="2" height="2" fill="#94a3b8" opacity=".10"/></pattern>
</defs>
<style>
text,tspan{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}

.t1{fill:#e7ecf3} .m{fill:#9aa6b8} .b{font-weight:700} .sb{font-weight:600}
.in{animation:in .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.flow{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}

.pk{transform-box:fill-box}
.pk{animation:travel 2.4s ease-in-out infinite;opacity:0}
@keyframes travel{0%{transform:translateX(0);opacity:0}15%{opacity:.95}85%{opacity:.95}100%{transform:translateX(var(--dx));opacity:0}}


</style>
<rect width="1600" height="620" fill="url(#bg)"/>
<rect width="1600" height="620" fill="url(#dots)"/>
<text x="34" y="66" font-size="38" font-weight="700" class="t1">How it works</text>
<text x="1566" y="64" font-size="24" text-anchor="end" class="m">reads your files · streams to your browser · stays on 127.0.0.1</text>
